<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Login | CampusVibe</title>
<meta name="description" content="CampusVibe - Discover. Participate. Celebrate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<header id="nav"></header>
<main class="auth-wrap"><div class="container"><div class="row justify-content-center"><div class="col-md-8 col-lg-5">
 <div class="form-card">
  <h1 class="h3">Student login</h1><p class="section-sub">Sign in to register for events and view your dashboard.</p>
  <div id="msg"></div>
  <form id="loginForm" class="live" novalidate>
   <div class="mb-3"><label class="form-label" for="ident">Email or registration number</label><input class="form-control" id="ident" type="text" autocomplete="username"><div class="err" id="e_ident"></div></div>
   <div class="mb-3"><label class="form-label" for="lpass">Password</label>
    <div class="input-group"><input class="form-control" id="lpass" type="password" autocomplete="current-password" style="border-radius:12px 0 0 12px"><button class="btn btn-outline-secondary" type="button" onclick="togglePw('lpass',this)" style="border-radius:0 12px 12px 0">Show</button></div><div class="err" id="e_lpass"></div></div>
   <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Remember me on this device</label></div>
   <button class="btn btn-cv w-100" type="submit">Log in</button>
  </form>
  <p class="small text-center mt-3 mb-1">New here? <a href="register.html">Create an account</a></p>
  <p class="small text-center text-muted mb-0">Demo: aarav@campus.edu / Demo@123</p>
 </div>
</div></div></div></main>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
