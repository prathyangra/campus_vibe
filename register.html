<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Registration | CampusVibe</title>
<meta name="description" content="CampusVibe - Discover. Participate. Celebrate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<header id="nav"></header>
<main class="auth-wrap"><div class="container"><div class="row justify-content-center"><div class="col-lg-7">
 <div class="form-card">
  <h1 class="h3">Create your student account</h1><p class="section-sub">All fields are required.</p>
  <div id="msg"></div>
  <form id="regForm" class="live" novalidate><div class="row g-3">
   <div class="col-md-6"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" type="text"><div class="err" id="e_name"></div></div>
   <div class="col-md-6"><label class="form-label" for="regNo">Registration number</label><input class="form-control" id="regNo" type="text" placeholder="e.g. 21CSE1002"><div class="err" id="e_regNo"></div></div>
   <div class="col-12"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" type="email"><div class="err" id="e_email"></div></div>
   <div class="col-md-6"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" autocomplete="new-password"><div class="err" id="e_password"></div><div class="form-text">Min 6 characters, with a letter and a number.</div></div>
   <div class="col-md-6"><label class="form-label" for="confirm">Confirm password</label><div class="input-group"><input class="form-control" id="confirm" type="password" autocomplete="new-password" style="border-radius:12px 0 0 12px"><button class="btn btn-outline-secondary" type="button" onclick="togglePw('confirm',this)" style="border-radius:0 12px 12px 0">Show</button></div><div class="err" id="e_confirm"></div></div>
   <div class="col-md-6"><label class="form-label" for="dept">Department</label><select class="form-select" id="dept"><option value="">Select department</option><option>Computer Science</option><option>Information Technology</option><option>Electronics</option><option>Electrical</option><option>Mechanical</option></select><div class="err" id="e_dept"></div></div>
   <div class="col-md-6"><label class="form-label" for="year">Year of study</label><select class="form-select" id="year"><option value="">Select year</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select><div class="err" id="e_year"></div></div>
   <div class="col-12"><span class="form-label d-block">Gender</span>
    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="gM" value="Male"><label class="form-check-label" for="gM">Male</label></div>
    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="gF" value="Female"><label class="form-check-label" for="gF">Female</label></div>
    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" id="gO" value="Other"><label class="form-check-label" for="gO">Other</label></div>
    <div class="err" id="e_gender"></div></div>
   <div class="col-12"><button class="btn btn-cv w-100" type="submit">Register</button></div>
  </div></form>
  <p class="small text-center mt-3 mb-0">Already registered? <a href="login.html">Log in</a></p>
 </div>
</div></div></div></main>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
