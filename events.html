<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore Events | CampusVibe</title>
<meta name="description" content="CampusVibe - Discover. Participate. Celebrate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<header id="nav"></header>
<main>
<section class="page-head"><div class="container"><h1>Explore Campus Events</h1><p>Search by name or filter by category. Press Esc in the search box to clear it.</p></div></section>
<section class="section"><div class="container">
 <div class="row g-3 align-items-center mb-3">
  <div class="col-lg-5"><input id="search" type="search" class="form-control" placeholder="Search events by name..." aria-label="Search events"></div>
  <div class="col-lg-7 d-flex flex-wrap gap-2">
   <button class="chip active" data-cat="All">All Events</button><button class="chip" data-cat="Technical">Technical</button>
   <button class="chip" data-cat="Cultural">Cultural</button><button class="chip" data-cat="Sports">Sports</button><button class="chip" data-cat="Workshops">Workshops</button>
  </div>
 </div>
 <p class="small text-muted mb-4"><span id="count"></span> · <span id="hoverMsg">Hover over a card for a quick preview.</span></p>
 <div class="row g-4" id="grid"></div>
 <div id="empty" class="alert alert-light border text-center d-none mt-3">No events match your search. Try another keyword or category.</div>
</div></section>
</main>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/events.js"></script>
</body>
</html>
